services:
  youtube-downloader:
    build: .
    container_name: youtube-downloader

    # Maps the container's port 5000 to the host's port 5000, so the
    # app is reachable at http://<host-ip>:5000 -- both from the host
    # machine itself and from other devices on the same Wi-Fi network,
    # since the Flask app inside the container binds to 0.0.0.0.
    ports:
      - "5000:5000"

    # Configuration is injected as environment variables rather than
    # baked into the image -- config.py reads these via os.getenv().
    # Adjust values here instead of editing code.
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      DEBUG: "False"
      MAX_DURATION_SECONDS: "10800"
      COOKIES_FROM_BROWSER: ""

    # Restart automatically if the container crashes or the host
    # machine reboots -- reasonable default for a self-hosted service
    # you want to just keep running in the background.
    restart: unless-stopped